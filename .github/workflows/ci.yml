name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Tests use in-memory SQLite; these only satisfy Settings() at import time
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      JWT_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check . --output-format github

      - name: Pytest
        run: uv run pytest --cov=loan_application --cov-report=term --cov-fail-under=90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loan-application:ci .
